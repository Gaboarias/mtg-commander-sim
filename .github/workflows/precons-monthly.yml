name: Revisión mensual de precons

# Revisa MTGJSON una vez al mes, actualiza la instantánea del índice de precons
# (api/precons_index.json) + baja las decklists nuevas, empuja los cambios a la
# rama `precons/monthly-update` e intenta abrir un PR. También se dispara a mano.
#
# Permisos necesarios en el repo (una sola vez):
#   Settings → Actions → General → Workflow permissions →
#     "Read and write permissions"  (obligatorio: permite el push)
#     "Allow GitHub Actions to create and approve pull requests" (opcional: PR
#      automático; sin esto, igual queda la rama lista para abrir el PR a mano).
on:
  schedule:
    - cron: "17 6 1 * *"      # día 1 de cada mes, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-precons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Actualizar índice de precons + bajar decklists nuevas
        run: python3 scripts/update_precons.py --download

      - name: Empujar cambios a la rama precons/monthly-update
        id: push
        run: |
          set -e
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sin cambios: no hay precons nuevos."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B precons/monthly-update
          git add api/precons_index.json data/precons
          git commit -m "Precons: revisión mensual (nuevos mazos de Commander)"
          git push --force-with-lease origin precons/monthly-update
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Abrir PR (best-effort; requiere el permiso de PRs)
        if: steps.push.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main --head precons/monthly-update \
            --title "Precons: revisión mensual" \
            --body "Revisión mensual automática de precons de Commander (MTGJSON).

          - Índice: \`api/precons_index.json\` (respaldo offline de \`/api/precons\`).
          - Decklists nuevas en \`data/precons/decks/\`.
          - Novedades en \`data/precons/NEW.md\`.

          Generado por \`.github/workflows/precons-monthly.yml\`." \
            || echo "No se pudo abrir el PR automáticamente; la rama precons/monthly-update ya está empujada para abrirlo a mano."
